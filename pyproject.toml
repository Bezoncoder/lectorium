[project]
name = "lectorium"
version = "0.1.0"
description = "Video learning service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pydantic-settings>=2.5.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    "passlib[bcrypt]>=1.7.4,<1.8.0",
    "bcrypt==4.3.0",
]

[tool.ruff]
line-length = 88
target-version = "py312"