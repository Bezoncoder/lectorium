{% extends "base.html" %}

{% block title %}Вход — Lectorium{% endblock %}

{% block content %}
<section class="auth-card">
  <h1>Вход в Lectorium</h1>

  {% if error %}
  <p class="alert alert-error">{{ error }}</p>
  {% endif %}

  <form method="post" action="/login" class="form">
    <label for="login">Логин</label>
    <input
      id="login"
      name="login"
      type="text"
      minlength="3"
      maxlength="64"
      autocomplete="username"
      required
    >

    <label for="password">Пароль</label>
    <input
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      required
    >

    <button class="button" type="submit">
      Войти
    </button>
  </form>
</section>
{% endblock %}
