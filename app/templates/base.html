<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta name="theme-color" content="#111318">
  <meta name="color-scheme" content="dark">

  <title>{% block title %}Lectorium{% endblock %}</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..700,0..1,0..200&family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet"
  >
  <link
    rel="stylesheet"
    href="{{ url_for('static', path='css/style.css') }}"
  >
</head>
<body>
  <header class="top-app-bar">
    <div class="app-container top-app-bar__content">
      <a class="brand" href="/" aria-label="Lectorium — главная">
        <span class="material-symbols-outlined brand__icon">
          school
        </span>
        <span>Lectorium</span>
      </a>

      {% if current_user %}
      <nav class="main-nav" aria-label="Главная навигация">
        <a href="/" class="main-nav__link">
          <span class="material-symbols-outlined">
            dashboard
          </span>
          <span>Кабинет</span>
        </a>

        <a href="/videos" class="main-nav__link">
          <span class="material-symbols-outlined">
            video_library
          </span>
          <span>Видео</span>
        </a>

        <a href="/statistics" class="main-nav__link">
          <span class="material-symbols-outlined">
            monitoring
          </span>
          <span>Статистика</span>
        </a>

        {% if current_user.role == "admin" %}
        <a href="/admin/videos" class="main-nav__link">
          <span class="material-symbols-outlined">
            admin_panel_settings
          </span>
          <span>Управление</span>
        </a>

        <a href="/admin/schedule" class="main-nav__link">
          <span class="material-symbols-outlined">
            edit_calendar
          </span>
          <span>Расписание</span>
        </a>
        {% endif %}
      </nav>

      <div class="account-menu">
        <div class="account-menu__identity">
          <span class="material-symbols-outlined">
            account_circle
          </span>
          <span>{{ current_user.login }}</span>
        </div>

        <form method="post" action="/logout">
          <button
            class="icon-button"
            type="submit"
            title="Выйти"
            aria-label="Выйти из аккаунта"
          >
            <span class="material-symbols-outlined">
              logout
            </span>
          </button>
        </form>
      </div>
      {% endif %}
    </div>
  </header>

  <main class="app-container page-content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
